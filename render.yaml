# Optional Render Blueprint for YantraSetu (the platform chosen for Phase 13).
# Deploys the backend as a Docker web service + a managed PostgreSQL.
# The portable Dockerfile also works on Railway/Fly.io/any VPS without this file.
#
# No secrets live here: SECRET_KEY is generated by Render, DATABASE_URL is wired
# from the managed database, and CORS_ORIGINS is set in the dashboard.
# NOTE: verify keys against Render's current Blueprint schema before use.
services:
  - type: web
    name: yantrasetu-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: WEB_CONCURRENCY
        value: "1"          # free tier is memory-constrained; raise on bigger plans
      - key: SECRET_KEY
        generateValue: true # Render generates a strong random value
      - key: DATABASE_URL
        fromDatabase:
          name: yantrasetu-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false          # set to your deployed frontend origin in the dashboard

databases:
  - name: yantrasetu-db
    databaseName: yantrasetu
    plan: free
